version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: collabspace_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-collabspace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - collabspace_net

  # 2. Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: collabspace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - collabspace_net

  # 3. Node.js API & Socket Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: collabspace_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-collabspace}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-collabspace_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collabspace_net

  # 4. React Frontend (Nginx Production Container)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: collabspace_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - collabspace_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  collabspace_net:
    driver: bridge
